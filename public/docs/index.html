<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Hemloop: Documentation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.2/marked.min.js" integrity="sha384-dAw12gnWShdrRMCwiNUvPHQ5IWS3uZwljXl3x7qNqvn+5gD/O/DXFCnR29GdXgOk" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js" integrity="sha384-46dPGH1XlTmj7bc50bqLjTdORXs/3EP2QpA/6EWbelYWOY9VGp+87RT61S3Mcslb" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0e0f11; --panel: #16181b; --ink: #e9e7e1; --dim: #a4a29c;
    --line: rgba(255,255,255,0.09); --accent: #cdeb5a; --link: #b7d84a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  nav { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    border-right: 1px solid var(--line); padding: 28px 20px; background: var(--panel); }
  nav .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  nav .tag { color: var(--dim); font-size: 12px; margin: 4px 0 24px; }
  nav a { display: block; color: var(--dim); text-decoration: none; padding: 7px 10px;
    border-radius: 8px; font-size: 14px; }
  nav a:hover { color: var(--ink); background: rgba(255,255,255,0.04); }
  nav a.active { color: #17210b; background: var(--accent); font-weight: 600; }
  nav .home { display:inline-block; margin-top: 24px; color: var(--link); font-size: 13px; }
  main { padding: 48px clamp(24px, 5vw, 72px); max-width: 900px; }
  article h1 { font-size: 32px; letter-spacing: -0.02em; margin: 0 0 8px; }
  article h2 { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 24px; font-size: 22px; }
  article h3 { margin-top: 28px; font-size: 17px; }
  article a { color: var(--link); }
  article code { background: rgba(255,255,255,0.07); padding: 1px 6px; border-radius: 5px; font-size: 0.88em; }
  article pre { background: #0a0b0d; border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; overflow-x: auto; }
  article pre code { background: none; padding: 0; }
  article table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  article th { background: rgba(255,255,255,0.04); }
  article blockquote { border-left: 3px solid var(--accent); margin: 16px 0; padding: 4px 16px; color: var(--dim); }
  article img { max-width: 100%; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; } nav { position: static; height: auto; } }
</style>
</head>
<body>
<nav>
  <div class="brand">Hemloop</div>
  <div class="tag">Documentation</div>
  <div id="toc"></div>
  <a class="home" href="/">← Home</a>
  <a class="home" href="/closet">Closet</a>
  <a class="home" href="/studio">Studio</a>
</nav>
<main><article id="content">Loading…</article></main>
<script>
  const DOCS = [
    ["README.md", "Overview"],
    ["PRD.md", "Product Requirements"],
    ["USE-CASES.md", "Use Cases"],
    ["USER-GUIDE.md", "User Guide"],
    ["TECH-GUIDE.md", "Tech Guide"],
    ["TEST-PLAN.md", "Test Plan"],
    ["SECURITY.md", "Security Review"],
    ["VERIFICATION.md", "Verification Record"],
    ["GAP-ANALYSIS.md", "Gap Analysis"],
    ["PHOTO-CREDITS.md", "Photo Credits"],
    ["DEMO-SCRIPT.md", "Demo Script"],
    ["WRITEUP.md", "Submission Writeup"],
  ];
  const toc = document.getElementById("toc");
  const content = document.getElementById("content");
  const links = {};
  for (const [file, label] of DOCS) {
    const a = document.createElement("a");
    a.href = "#" + file; a.textContent = label; a.dataset.file = file;
    toc.appendChild(a); links[file] = a;
  }
  async function load(file) {
    for (const f in links) links[f].classList.toggle("active", f === file);
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      content.innerHTML = DOMPurify.sanitize(marked.parse(md));
      window.scrollTo(0, 0);
    } catch (e) {
      content.innerHTML = "<p>Could not load " + file + ".</p>";
    }
  }
  function route() {
    const file = location.hash.slice(1);
    load(DOCS.some(([f]) => f === file) ? file : DOCS[0][0]);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
