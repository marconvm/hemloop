<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemloop: Documentation</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.2/marked.min.js" integrity="sha384-dAw12gnWShdrRMCwiNUvPHQ5IWS3uZwljXl3x7qNqvn+5gD/O/DXFCnR29GdXgOk" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js" integrity="sha384-46dPGH1XlTmj7bc50bqLjTdORXs/3EP2QpA/6EWbelYWOY9VGp+87RT61S3Mcslb" crossorigin="anonymous"></script>
<style>
  /* Tokens shared with the app: see app/globals.css + SiteHeader. */
  :root {
    --ink: #17211c; --forest: #183e30; --moss: #346b45; --loop: #b9f227;
    --cream: #f4f0e6; --paper: #fbfaf5; --white: #ffffff; --coral: #ee6f4d;
    --muted: #687169; --line: rgba(23, 33, 28, 0.13);
    --loop-ink: #17211c; --loop-line: rgb(23 33 28 / 13%);
    --font-display: 'Manrope', system-ui, sans-serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --font-heading: var(--font-display), var(--font-body);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 16px/1.62 var(--font-body); }
  a { color: var(--forest); }

  .site-header {
    position: sticky; top: 0; z-index: 50;
    display: grid; grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr);
    align-items: center; min-height: 72px;
    padding: 10px clamp(18px, 3vw, 48px);
    border-bottom: 1px solid var(--loop-line);
    background: rgb(251 250 245 / 92%); color: var(--loop-ink);
    backdrop-filter: blur(18px);
  }
  .site-brand {
    display: inline-flex; align-items: center; width: max-content; gap: 10px;
    color: inherit; font-family: var(--font-heading); font-size: 21px; font-weight: 800;
    letter-spacing: -0.055em; text-decoration: none;
  }
  .site-brand-logo {
    display: block; width: 31px; height: 31px; flex: 0 0 auto;
  }
  .site-nav {
    display: flex; align-items: center; gap: 4px; padding: 4px;
    border: 1px solid var(--loop-line); border-radius: 999px;
    background: rgb(255 255 255 / 78%); box-shadow: 0 8px 24px rgb(23 33 28 / 5%);
  }
  .site-nav a {
    padding: 8px 13px; border-radius: 999px; color: #566159;
    font-size: 13px; font-weight: 700; line-height: 1; text-decoration: none;
    transition: background 160ms ease, color 160ms ease;
  }
  .site-nav a:hover, .site-nav a:focus-visible {
    background: #eef1e9; color: var(--loop-ink); outline: none;
  }
  .site-nav a.is-active,
  .site-nav a[aria-current="page"] {
    background: var(--loop-ink); color: #fff;
  }
  .site-header-meta {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0;
  }

  .site-footer {
    margin-top: auto;
    display: grid; grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr);
    align-items: center; gap: 24px; min-height: 112px;
    padding: 24px clamp(18px, 3vw, 48px);
    border-top: 1px solid var(--loop-line);
    background: var(--paper); color: var(--loop-ink);
  }
  .site-footer nav {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px;
  }
  .site-footer nav a {
    color: var(--muted); font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .site-footer nav a:hover,
  .site-footer nav a:focus-visible,
  .site-footer nav a[aria-current="page"] {
    color: var(--loop-ink); text-decoration: underline; text-underline-offset: 4px;
  }
  .site-footer > p {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    margin: 0; color: var(--muted); font-size: 12px; font-weight: 700;
  }
  .site-footer > p a {
    color: inherit; text-underline-offset: 3px;
  }

  .frame { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; max-width: 1180px; margin: 0 auto; padding: 34px 28px 80px; width: 100%; }
  nav.toc { position: sticky; top: 88px; align-self: start; }
  .toc .kicker { margin: 0 0 10px; color: var(--moss); font: 800 11px/1 var(--font-body); letter-spacing: .13em; text-transform: uppercase; }
  .toc a { display: block; padding: 8px 12px; margin: 2px 0; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: 14px; }
  .toc a:hover { background: var(--cream); }
  .toc a.active { background: var(--ink); color: var(--white); }
  .toc .group { margin-top: 22px; }
  .toc .foot { margin-top: 26px; font-size: 12px; color: var(--muted); }
  .toc .foot a { display: inline; padding: 0; color: var(--muted); text-decoration: underline; font-size: 12px; }

  article { background: var(--white); border: 1px solid var(--line); border-radius: 22px; padding: 42px 46px; }
  article h1 { margin: 0 0 18px; font: 760 clamp(30px, 3.6vw, 44px)/1.02 var(--font-display); letter-spacing: -.05em; }
  article h2 { margin: 36px 0 12px; font: 750 22px/1.15 var(--font-display); letter-spacing: -.03em; }
  article h3 { margin: 28px 0 10px; font: 700 17px/1.25 var(--font-display); letter-spacing: -.02em; }
  article p, article li { max-width: 72ch; }
  article code { background: var(--cream); padding: 2px 6px; border-radius: 6px; font-size: .92em; }
  article pre { background: var(--ink); color: #eef3ea; padding: 18px 20px; border-radius: 14px; overflow: auto; font-size: 13px; line-height: 1.5; }
  article pre code { background: none; padding: 0; color: inherit; }
  article table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14px; }
  article th, article td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  article th { color: var(--muted); font: 700 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; }
  article blockquote { border-left: 3px solid var(--loop); margin: 16px 0; padding: 4px 16px; color: var(--muted); }
  article img { display: block; max-width: 100%; margin: 22px 0; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(23,33,28,.10); }

  /* Inline flow maps: scroll horizontally below ~520 so they stay readable at 430. */
  article .flow-diagram {
    margin: 22px 0;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--cream);
    padding: 14px 12px;
  }
  article .flow-diagram svg {
    display: block;
    width: 640px;
    max-width: none;
    height: auto;
  }

  @media (max-width: 860px) {
    .site-header {
      position: relative; grid-template-columns: 1fr auto; gap: 8px 14px; padding-block: 12px;
    }
    .site-nav { grid-column: 1 / -1; grid-row: 2; justify-content: center; overflow-x: auto; }
    .site-footer { grid-template-columns: 1fr auto; }
    .site-footer nav { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
  }
  @media (max-width: 820px) {
    .frame { grid-template-columns: 1fr; padding: 22px 16px 60px; }
    nav.toc { position: static; }
    article { padding: 28px 22px; }
  }
  @media (max-width: 480px) {
    .site-header { padding-inline: 13px; }
    .site-nav { justify-content: stretch; }
    .site-nav a { flex: 1; padding-inline: 8px; text-align: center; }
    .site-footer { grid-template-columns: 1fr; }
    .site-footer > p { justify-content: flex-start; }
    .site-footer nav { grid-column: auto; grid-row: auto; }
  }
</style>
</head>
<body>
<header class="site-header">
  <a class="site-brand" href="/" aria-label="Hemloop home">
    <img class="site-brand-logo" src="/logo.svg" alt="" width="31" height="31" aria-hidden="true" />
    <span>hemloop</span>
  </a>
  <nav class="site-nav" aria-label="Hemloop surfaces">
    <a href="/">Hemloop</a>
    <a href="/closet">Closet</a>
    <a href="/studio">Studio</a>
    <a href="/docs/" aria-current="page" class="is-active">Docs</a>
  </nav>
  <div class="site-header-meta"></div>
</header>

<div class="frame">
  <nav class="toc" aria-label="Documentation">
    <p class="kicker">Read in order</p>
    <div id="toc"></div>
    <div class="group"><p class="kicker">Use cases</p><div id="toc-uc"></div></div>
    <p class="foot">Product photos in the shopper's wardrobe are real, from the author's own catalogs, used with permission. The merchant is fictional. <a href="#PHOTO-CREDITS.md">Provenance</a>.</p>
  </nav>
  <main>
    <article id="content">Loading…</article>
  </main>
</div>

<footer class="site-footer">
  <a class="site-brand" href="/" aria-label="Hemloop home">
    <img class="site-brand-logo" src="/logo.svg" alt="" width="31" height="31" aria-hidden="true" />
    <span>hemloop</span>
  </a>
  <nav aria-label="Hemloop footer navigation">
    <a href="/">Hemloop</a>
    <a href="/closet">Closet</a>
    <a href="/studio">Studio</a>
    <a href="/docs/" aria-current="page">Docs</a>
  </nav>
  <p>© 2026 Marco Cheung · <a href="https://github.com/marconvm/hemloop" rel="noopener" target="_blank">Source on GitHub</a></p>
</footer>

<script>
  // Five reading-order docs + use cases from the sidebar. Guides (USER-GUIDE,
  // TECH-GUIDE, SECURITY) stay in the repo mirror for developers; the site
  // folds visitor needs into Quick start. Provenance stays reachable from the foot.
  const DOCS = [
    ["01-what-is-hemloop.md", "What is Hemloop"],
    ["02-the-loop.md", "The loop, and what each side gets"],
    ["03-the-problem.md", "The problem in the real world"],
    ["04-webmcp-overview.md", "Hemloop and WebMCP"],
    ["05-quick-start.md", "Quick start"],
  ];
  const USE_CASES = [
    ["uc-right-time.md", "Right time"],
    ["uc-cannot-fill.md", "What the merchant cannot fill"],
    ["uc-family.md", "Shopping for someone else"],
    ["uc-rival-receipt.md", "A receipt from a rival"],
    ["uc-handoff.md", "Handoff to a shopping agent"],
  ];
  const EXTRA = [
    ["PHOTO-CREDITS.md", "Provenance"],
  ];
  const ALL = [...DOCS, ...USE_CASES, ...EXTRA];

  const toc = document.getElementById("toc");
  const tocUc = document.getElementById("toc-uc");
  const content = document.getElementById("content");
  const addLink = (parent, file, label) => {
    const a = document.createElement("a");
    a.href = "#" + file; a.textContent = label; a.dataset.file = file;
    parent.appendChild(a); return a;
  };
  for (const [file, label] of DOCS) addLink(toc, file, label);
  for (const [file, label] of USE_CASES) addLink(tocUc, file, label);

  const PURIFY = {
    ADD_TAGS: [
      'svg', 'g', 'path', 'rect', 'circle', 'line', 'polyline', 'polygon',
      'text', 'tspan', 'defs', 'marker', 'use', 'title', 'desc', 'foreignObject',
    ],
    ADD_ATTR: [
      'viewBox', 'xmlns', 'fill', 'stroke', 'stroke-width', 'stroke-linecap',
      'stroke-linejoin', 'stroke-dasharray', 'd', 'x', 'y', 'x1', 'y1', 'x2', 'y2',
      'cx', 'cy', 'r', 'width', 'height', 'rx', 'ry', 'transform', 'text-anchor',
      'font-size', 'font-family', 'font-weight', 'opacity', 'marker-end', 'marker-start',
      'dx', 'dy', 'class', 'role', 'aria-hidden', 'aria-label', 'points', 'refX', 'refY',
      'orient', 'markerWidth', 'markerHeight', 'id', 'href', 'xlink:href', 'letter-spacing',
    ],
  };

  async function load(file) {
    document.querySelectorAll("nav.toc a[data-file]").forEach((el) => {
      el.classList.toggle("active", el.dataset.file === file);
    });
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      content.innerHTML = DOMPurify.sanitize(marked.parse(md), PURIFY);
      window.scrollTo(0, 0);
    } catch (e) {
      content.innerHTML = "<p>Could not load " + file + ".</p>";
    }
  }
  function route() {
    const file = location.hash.slice(1);
    load(ALL.some(([f]) => f === file) ? file : DOCS[0][0]);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
