<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hemloop · video cards · landscape</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,500&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111313;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .paper {
        position: absolute;
        inset: 0;
        background: #f4f0e6;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 96px;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
        text-align: center;
        max-width: 1480px;
      }
      .mark {
        width: 120px;
        height: 120px;
        display: block;
      }
      .mark svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .kicker {
        font-family: "DM Sans", system-ui, sans-serif;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #687169;
      }
      .title {
        font-family: "Manrope", system-ui, sans-serif;
        font-weight: 800;
        font-size: 72px;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: #17211c;
      }
      .title .lime {
        color: #346b45;
      }
      .step-label {
        font-family: "Manrope", system-ui, sans-serif;
        font-weight: 800;
        font-size: 88px;
        line-height: 1.05;
        letter-spacing: -0.025em;
        color: #17211c;
      }
      .step-meta {
        font-family: "DM Sans", system-ui, sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #687169;
      }
      .step-meta .n {
        color: #17211c;
      }
      .dot-lime {
        fill: #b9f227;
      }
      .ring-ink {
        fill: none;
        stroke: #17211c;
        stroke-width: 2;
      }
      .dot-stroke {
        stroke: #17211c;
        stroke-width: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.9"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div class="paper" aria-hidden="true"></div>

      <!-- Intro 0–2.5s -->
      <section id="card-intro" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-intro" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <h1 class="title" id="intro-title">
            Hemloop · one request, all the way round · built on WebMCP
          </h1>
        </div>
      </section>

      <!-- Step cards 2.5 + n*1.2 -->
      <section id="card-step-1" class="clip" data-start="2.5" data-duration="1.2" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-1" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <p class="step-meta">Step <span class="n">1</span> of 7</p>
          <h2 class="step-label" id="label-1">New item</h2>
        </div>
      </section>

      <section id="card-step-2" class="clip" data-start="3.7" data-duration="1.2" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-2" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <p class="step-meta">Step <span class="n">2</span> of 7</p>
          <h2 class="step-label" id="label-2">Local demand</h2>
        </div>
      </section>

      <section id="card-step-3" class="clip" data-start="4.9" data-duration="1.2" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-3" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <p class="step-meta">Step <span class="n">3</span> of 7</p>
          <h2 class="step-label" id="label-3">Approved request</h2>
        </div>
      </section>

      <section id="card-step-4" class="clip" data-start="6.1" data-duration="1.2" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-4" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <p class="step-meta">Step <span class="n">4</span> of 7</p>
          <h2 class="step-label" id="label-4">Matched offer</h2>
        </div>
      </section>

      <section id="card-step-5" class="clip" data-start="7.3" data-duration="1.2" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-5" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <p class="step-meta">Step <span class="n">5</span> of 7</p>
          <h2 class="step-label" id="label-5">Bought</h2>
        </div>
      </section>

      <section id="card-step-6" class="clip" data-start="8.5" data-duration="1.2" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-6" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <p class="step-meta">Step <span class="n">6</span> of 7</p>
          <h2 class="step-label" id="label-6">Learned</h2>
        </div>
      </section>

      <section id="card-step-7" class="clip" data-start="9.7" data-duration="1.2" data-track-index="1">
        <div class="card">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-ink" cx="16" cy="16" r="11" />
              <g id="orbit-7" class="orbit">
                <circle class="dot-lime dot-stroke" cx="16" cy="5" r="3.5" />
              </g>
            </svg>
          </div>
          <p class="step-meta">Step <span class="n">7</span> of 7</p>
          <h2 class="step-label" id="label-7">Again</h2>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const ORBIT = { svgOrigin: "16 16", ease: "none" };

      // Intro: label rise + one full orbit over 2.5 s
      tl.from("#intro-title", { y: 12, opacity: 0, duration: 0.55, ease: "power2.out" }, 0.15);
      tl.fromTo("#orbit-intro", { rotation: 0 }, { rotation: 360, duration: 2.5, ...ORBIT }, 0);

      const steps = [1, 2, 3, 4, 5, 6, 7];
      for (const n of steps) {
        const start = 2.5 + (n - 1) * 1.2;
        tl.from(`#label-${n}`, { y: 12, opacity: 0, duration: 0.4, ease: "power2.out" }, start + 0.05);
        tl.fromTo(`#orbit-${n}`, { rotation: 0 }, { rotation: 360, duration: 1.2, ...ORBIT }, start);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
