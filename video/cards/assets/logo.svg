<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hemloop">
  <!--
    Single source mark: ring + lime dot.
    Geometry (shared with favicon.svg / favicon.ico / logo-loop.gif):
      ring: cx=16 cy=16 r=11 stroke-width=2
      dot:  r=3.5 stroke-width=1, rest at (16, 5) = top of ring
    Animation runs inside the SVG so it also plays when used as <img>.
  -->
  <style>
    .orbit {
      transform-origin: 16px 16px;
      animation: hem-orbit 2.5s linear infinite;
    }
    @keyframes hem-orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit { animation: none; }
    }
  </style>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#17211c" stroke-width="2" />
  <g class="orbit">
    <circle cx="16" cy="5" r="3.5" fill="#b9f227" stroke="#17211c" stroke-width="1" />
  </g>
</svg>
